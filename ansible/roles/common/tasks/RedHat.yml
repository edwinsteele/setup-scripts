---
# root's SSH key is already set by the pxe_install kickstart's `sshkey`
#  directive, so unlike the OpenBSD branch there's no key-setup task here.
- name: Only allow root login with keys
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin.*"
    line: "PermitRootLogin prohibit-password"
    validate: "sshd -t -f %s"
  notify:
    - Restart sshd

- name: Don't allow auth with password
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication.*"
    line: "PasswordAuthentication no"
    validate: "sshd -t -f %s"
  notify:
    - Restart sshd

# esteele's password is locked (see roles/esteele_acct), so it needs
#  passwordless sudo to do anything privileged - the RedHat-branch
#  equivalent of the OpenBSD bootstrap role's `permit nopass :wheel` in
#  doas.conf.
- name: Allow wheel group passwordless sudo
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/wheel-nopasswd
    owner: root
    group: root
    mode: 0440
    validate: "visudo -cf %s"

- name: Install standard packages
  ansible.builtin.dnf:
    name:
      - usbutils
      - flashrom
      - dmidecode
    state: present

- name: Enable and start chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

# Kickstart's `network --hostname=` only applies at install time - if that
#  default drifts from the name we actually want (e.g. pxe_install_hostname
#  said "apu3srv" when this box was reimaged, before it got the "viking"
#  name), nothing else corrects it, including on reboot. common_hostname
#  lets a specific host (see host_vars/192.168.20.200.yml) fix that.
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname | length > 0

- name: Re-gather hostname/fqdn facts after a hostname change
  ansible.builtin.setup:
    filter: ansible_hostname,ansible_fqdn
  when: common_hostname | length > 0

- name: Setup /etc/hosts with FQDN
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127.0.0.1'
    line: '127.0.0.1 localhost {{ ansible_facts["fqdn"] }} {{ ansible_facts["hostname"] }}'

---
# Home Assistant Container's official image - see
# https://www.home-assistant.io/installation/linux#install-home-assistant-container
# ":stable" is friendliest for a first apply; pinning to a specific version
# (e.g. "2025.12.0") is the recommended pattern once this is running, so an
# upgrade is a deliberate git commit rather than whatever ships next.
home_assistant_image: docker.io/homeassistant/home-assistant:stable
home_assistant_config_path: /srv/homeassistant/config
# Matches pxe_install_timezone and the OpenBSD common role's Sydney default.
home_assistant_timezone: Australia/Sydney

# HomeKit Bridge's HAP (HomeKit Accessory Protocol) port - must match the
# "port" value in the "homekit" entry of
# {{ home_assistant_config_path }}/.storage/core.config_entries. HA picks
# this port once on first setup and it isn't easily changed afterward
# without re-pairing every paired device.
home_assistant_homekit_port: 21064

# Off-host copy of the git-tracked YAML layer (automations/scripts/scenes/
# configuration.yaml) - see the "Off-host backup of the git layer" section
# of the role README. Pushed nightly alongside the autosnapshot commit.
home_assistant_backup_repo_url: git@github.com:edwinsteele/ha-config-backup.git
# Dedicated (not shared) deploy key, scoped to this one repo via
# core.sshCommand below rather than root's general SSH identity - generating
# and registering it is a manual one-time step, see the README.
home_assistant_backup_deploy_key_path: /root/.ssh/ha-config-backup_ed25519
# Dedicated known_hosts, not root's general one - pinned to GitHub's
# official published host keys (files/ha-config-backup_known_hosts,
# fetched from https://api.github.com/meta over HTTPS) rather than
# trust-on-first-connect, same "scoped, minimal blast radius" reasoning
# as the deploy key itself.
home_assistant_backup_known_hosts_path: /root/.ssh/ha-config-backup_known_hosts

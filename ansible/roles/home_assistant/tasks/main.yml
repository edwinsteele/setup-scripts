---
- name: Install podman
  ansible.builtin.dnf:
    name: podman
    state: present
  become: true

- name: Create Home Assistant config directory
  ansible.builtin.file:
    path: "{{ home_assistant_config_path }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  become: true

# Runs as root, same as the container itself (see the Quadlet unit below) -
# every file HA writes into this directory is root-owned, so hand edits
# and any ad-hoc git commands need `sudo` (frictionless: esteele already
# has passwordless wheel sudo from roles/common's RedHat branch).
- name: Initialise git repo for the Home Assistant config directory
  ansible.builtin.command: git init
  args:
    chdir: "{{ home_assistant_config_path }}"
    creates: "{{ home_assistant_config_path }}/.git"
  become: true

- name: Configure git identity for the Home Assistant config repo
  community.general.git_config:
    repo: "{{ home_assistant_config_path }}"
    scope: local
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  become: true
  loop:
    - { name: user.name, value: "Home Assistant autosnapshot" }
    # Deliberately not ansible_facts['fqdn'] - this becomes the commit
    #  author on every autosnapshot forever, and shouldn't depend on
    #  whatever domain the box's FQDN happens to resolve to today.
    - { name: user.email, value: "homeassistant-autosnapshot@viking.invalid" }

- name: Configure git remote for off-host config backups
  ansible.builtin.command: git remote add backup {{ home_assistant_backup_repo_url }}
  args:
    chdir: "{{ home_assistant_config_path }}"
  become: true
  register: home_assistant_backup_remote
  changed_when: home_assistant_backup_remote.rc == 0
  failed_when: home_assistant_backup_remote.rc != 0 and 'already exists' not in home_assistant_backup_remote.stderr

- name: Install pinned GitHub host keys for the backup remote
  ansible.builtin.copy:
    src: ha-config-backup_known_hosts
    dest: "{{ home_assistant_backup_known_hosts_path }}"
    owner: root
    group: root
    mode: 0644
  become: true

# The actual key file is generated and registered as a GitHub deploy key by
# hand (see the README) - ansible only points git at where it'll be.
- name: Scope git SSH command to the dedicated backup deploy key
  community.general.git_config:
    repo: "{{ home_assistant_config_path }}"
    scope: local
    name: core.sshCommand
    value: "ssh -i {{ home_assistant_backup_deploy_key_path }} -o IdentitiesOnly=yes -o UserKnownHostsFile={{ home_assistant_backup_known_hosts_path }}"
  become: true

- name: Template .gitignore for the Home Assistant config repo
  ansible.builtin.copy:
    src: gitignore
    dest: "{{ home_assistant_config_path }}/.gitignore"
    owner: root
    group: root
    mode: 0644
  become: true

- name: Seed a baseline configuration.yaml (first run only, never overwritten)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ home_assistant_config_path }}/configuration.yaml"
    owner: root
    group: root
    mode: 0644
    force: false
  become: true

- name: Open firewalld port for the Home Assistant web UI
  ansible.posix.firewalld:
    port: 8123/tcp
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Open firewalld port for the HomeKit Bridge (HAP)
  ansible.posix.firewalld:
    port: "{{ home_assistant_homekit_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Template Home Assistant Quadlet unit
  ansible.builtin.template:
    src: home-assistant.container.j2
    dest: /etc/containers/systemd/home-assistant.container
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Restart Home Assistant

- name: Reload systemd, enable and start Home Assistant
  ansible.builtin.systemd:
    daemon_reload: true
    name: home-assistant.service
    state: started
    enabled: true
  become: true

- name: Template the git-snapshot script
  ansible.builtin.template:
    src: home-assistant-git-snapshot.sh.j2
    dest: /usr/local/bin/home-assistant-git-snapshot.sh
    owner: root
    group: root
    mode: 0755
  become: true

- name: Install the git-snapshot systemd service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: 0644
  become: true
  loop:
    - home-assistant-git-snapshot.service
    - home-assistant-git-snapshot.timer

- name: Reload systemd, enable and start the git-snapshot timer
  ansible.builtin.systemd:
    daemon_reload: true
    name: home-assistant-git-snapshot.timer
    state: started
    enabled: true
  become: true

- name: Create local backups directory for Home Assistant's own Backup feature
  ansible.builtin.file:
    path: "{{ home_assistant_config_path }}/backups"
    state: directory
    owner: root
    group: root
    mode: 0700
  become: true

- name: Create destination directory for .storage-layer backup copies on the second disk
  ansible.builtin.file:
    path: "{{ home_assistant_storage_backup_dest }}"
    state: directory
    owner: root
    group: root
    # 0700, not the traversable 0755/0775 samba_media uses for its own mount
    #  point and share subfolder - these archives bundle .storage's
    #  credentials, and nothing shares this path over Samba (only
    #  samba_media_share_path, a sibling directory, has a [Media] stanza in
    #  smb.conf), but it should still be unreadable to any other local user.
    mode: 0700
  become: true

- name: Template the storage-backup script
  ansible.builtin.template:
    src: home-assistant-storage-backup.sh.j2
    dest: /usr/local/bin/home-assistant-storage-backup.sh
    owner: root
    group: root
    mode: 0755
  become: true

- name: Install the storage-backup systemd service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: 0644
  become: true
  loop:
    - home-assistant-storage-backup.service
    - home-assistant-storage-backup.timer

- name: Reload systemd, enable and start the storage-backup timer
  ansible.builtin.systemd:
    daemon_reload: true
    name: home-assistant-storage-backup.timer
    state: started
    enabled: true
  become: true

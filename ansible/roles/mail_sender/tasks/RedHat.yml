---
# Reuses the same "user:pass" value the OpenBSD branch's secrets table
# keys under mail_sender_secrets_label, rather than a second copy of the
# credential in a Rocky-specific private vars file.
- name: Extract the relay credential's "user:pass" value from the shared secrets file
  ansible.builtin.set_fact:
    mail_sender_relay_credential: >-
      {{ (lookup('file', mail_sender_secrets_file).splitlines()
          | select('match', '^' ~ mail_sender_secrets_label ~ '\s')
          | list | first).split(None, 1)[1] }}
  no_log: true

- name: Split the relay credential into username and password
  ansible.builtin.set_fact:
    mail_sender_relay_username: "{{ mail_sender_relay_credential.split(':', 1)[0] }}"
    mail_sender_relay_password: "{{ mail_sender_relay_credential.split(':', 1)[1] }}"
  no_log: true

- name: Install postfix and its SASL auth plugin
  ansible.builtin.dnf:
    name:
      - postfix
      - cyrus-sasl-plain
    state: present
  become: true

- name: Template postfix main.cf as a relay-only satellite
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart postfix

- name: Template the relay's SASL credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify:
    - Postmap sasl_passwd
    - Restart postfix

- name: Forward root's mail
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "^root:"
    line: "root:\t\t{{ mail_sender_root_forward }}"
  become: true
  notify:
    - Update aliases database
    - Restart postfix

- name: Enable and start postfix
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
  become: true

---
- name: Check current kernel boot args for the Seagate USB-SATA bridge quirk
  ansible.builtin.command: grubby --info=ALL
  register: samba_server_grubby_info
  changed_when: false
  become: true

# The Seagate "Expansion Desk" enclosure holding both shares' partitions
#  (see Disk layout below) drops commands under sustained write load when
#  driven by the Linux `uas` (USB Attached SCSI) driver - repeated SCSI
#  resets, then a hard I/O error, then an XFS log shutdown. Hit for real on
#  2026-08-11 partway through the initial rsync-in of the media library.
#  Forcing the older usb-storage (BOT) driver via this kernel quirk avoids
#  it. grubby only edits the bootloader entry - takes effect on next boot,
#  not applied live, so this alone doesn't fix an already-booted host.
- name: Disable UAS for the Seagate USB-SATA bridge (survives reimage/reboot)
  ansible.builtin.command: >
    grubby --update-kernel=ALL --args=usb-storage.quirks={{ samba_server_seagate_usb_id }}:u
  when: "('usb-storage.quirks=' + samba_server_seagate_usb_id + ':u') not in samba_server_grubby_info.stdout"
  become: true

- name: Install samba and avahi
  ansible.builtin.dnf:
    name:
      # vfs_fruit.so ships inside the base samba package on Rocky 9 (samba
      #  4.23.5-10.el9_8 confirmed via `dnf repoquery -l samba`) - there is
      #  no separate samba-vfs-modules package.
      - samba
      - avahi
    state: present
  become: true

- name: Template smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: 0644
    validate: "testparm -s %s"
  become: true
  notify: Restart smb

- name: Open firewalld services for Samba and mDNS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop:
    - samba
    - mdns

- name: Enable and start smb
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true
  become: true

- name: Enable and start avahi-daemon
  ansible.builtin.service:
    name: avahi-daemon
    state: started
    enabled: true
  become: true

- name: Flush handlers so smb picks up config immediately
  ansible.builtin.meta: flush_handlers

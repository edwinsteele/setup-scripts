---
- name: Check current kernel boot args for the Seagate USB-SATA bridge quirk
  ansible.builtin.command: grubby --info=ALL
  register: samba_server_grubby_info
  changed_when: false
  become: true

# The Seagate "Expansion Desk" enclosure holding both shares' partitions
#  (see Disk layout below) drops commands under sustained write load when
#  driven by the Linux `uas` (USB Attached SCSI) driver - repeated SCSI
#  resets, then a hard I/O error, then an XFS log shutdown. Hit for real on
#  2026-08-11 partway through the initial rsync-in of the media library.
#  Forcing the older usb-storage (BOT) driver via this kernel quirk avoids
#  it. grubby only edits the bootloader entry - takes effect on next boot,
#  not applied live, so this alone doesn't fix an already-booted host.
- name: Disable UAS for the Seagate USB-SATA bridge (survives reimage/reboot)
  ansible.builtin.command: >
    grubby --update-kernel=ALL --args=usb-storage.quirks={{ samba_server_seagate_usb_id }}:u
  when: "('usb-storage.quirks=' + samba_server_seagate_usb_id + ':u') not in samba_server_grubby_info.stdout"
  become: true

- name: Install samba and avahi
  ansible.builtin.dnf:
    name:
      # vfs_fruit.so ships inside the base samba package on Rocky 9 (samba
      #  4.23.5-10.el9_8 confirmed via `dnf repoquery -l samba`) - there is
      #  no separate samba-vfs-modules package.
      - samba
      - avahi
    state: present
  become: true

- name: Install hdparm
  ansible.builtin.dnf:
    name: hdparm
    state: present
  become: true

- name: Check whether the disk is currently attached
  ansible.builtin.stat:
    path: "{{ samba_server_disk_device }}"
  register: samba_server_disk_stat
  become: true

- name: Check current Advanced Power Management level on the disk
  ansible.builtin.command: hdparm -B {{ samba_server_disk_device }}
  register: samba_server_disk_apm_check
  changed_when: false
  become: true
  when: samba_server_disk_stat.stat.exists

# Seagate desktop drives (this one's a BarraCuda ST4000DM005, see Disk
#  layout below) default to APM level 128 - the lowest level that still
#  disallows full standby (motor stop), but still permits internal idle-C
#  head unloading on any brief pause. Observed via smartctl on 2026-08-11:
#  Load_Cycle_Count (head park/unload events) was at 351,760 against a
#  ~300,000-cycle rated budget after ~4 years, while Power_Cycle_Count
#  (actual spin-downs) was only 45 - the wear is coming from constant head
#  parking between backups/idle periods, not from the drive spinning down.
#  Level 254 disables APM's power-saving states entirely (no standby, no
#  idle-C/head-unload).
- name: Set Advanced Power Management level to disable aggressive head-parking
  ansible.builtin.command: hdparm -B {{ samba_server_disk_apm_level }} {{ samba_server_disk_device }}
  when:
    - samba_server_disk_stat.stat.exists
    - "('APM_level\t= ' ~ samba_server_disk_apm_level) not in samba_server_disk_apm_check.stdout"
  become: true

- name: Template udev rule to reapply APM level whenever the disk (re)appears
  # hdparm -B doesn't survive a power cycle or USB replug, so the setting
  #  above needs reapplying every time the disk enumerates, not just once.
  ansible.builtin.template:
    src: 99-seagate-apm.rules.j2
    dest: /etc/udev/rules.d/99-seagate-apm.rules
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Reload udev rules

- name: Template smartd configuration for the disk
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Restart smartd

- name: Enable and start smartd
  ansible.builtin.service:
    name: smartd
    state: started
    enabled: true
  become: true

- name: Template smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: 0644
    validate: "testparm -s %s"
  become: true
  notify: Restart smb

- name: Open firewalld services for Samba and mDNS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop:
    - samba
    - mdns

- name: Enable and start smb
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true
  become: true

- name: Enable and start avahi-daemon
  ansible.builtin.service:
    name: avahi-daemon
    state: started
    enabled: true
  become: true

- name: Flush handlers so smb picks up config immediately
  ansible.builtin.meta: flush_handlers

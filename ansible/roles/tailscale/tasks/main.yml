---
# Imported explicitly rather than left to dnf's on-install auto-import, so
# a non-interactive run can't stall or fail on the key prompt.
- name: Import Tailscale's package signing key
  ansible.builtin.rpm_key:
    key: "{{ tailscale_repo_base }}/repo.gpg"
    state: present
  become: true

- name: Add Tailscale's stable dnf repo
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: "{{ tailscale_repo_base }}/$basearch"
    gpgkey: "{{ tailscale_repo_base }}/repo.gpg"
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
  become: true

- name: Install tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
  become: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled.service
    state: started
    enabled: true
  become: true

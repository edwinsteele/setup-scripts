---
# Temporary TFTP/HTTP netboot service for one-off Rocky Linux PXE reimages.
# pxe_install_enabled is a single on/off switch: flipping it back to false
# (the default) is a full teardown, not a pause - see the "disable" block
# below.

- name: Ensure tftp root exists
  file:
    path: "{{ pxe_install_tftp_root }}"
    state: directory
    owner: root
    group: wheel
    mode: 0755
  when: pxe_install_enabled

- name: Fetch vmlinuz/initrd.img from the Rocky mirror
  get_url:
    url: "{{ pxe_install_mirror }}/images/pxeboot/{{ item }}"
    dest: "{{ pxe_install_tftp_root }}/{{ item }}"
    owner: root
    group: wheel
    mode: 0644
  loop:
    - vmlinuz
    - initrd.img
  when: pxe_install_enabled

# The box's coreboot+SeaBIOS boot menu offers an iPXE entry per NIC (see
# plan notes); DHCP `filename` for the reserved MAC should point at this
# script. iPXE fetches vmlinuz/initrd.img itself over tftp:// from this same
# host rather than us pre-staging a pxelinux/syslinux chain, which needs no
# extra bootloader binaries on this OpenBSD box.
- name: Template iPXE boot script
  template:
    src: boot_ipxe.j2
    dest: "{{ pxe_install_tftp_root }}/{{ pxe_install_boot_script_name }}"
    owner: root
    group: wheel
    mode: 0644
  when: pxe_install_enabled

- name: Template kickstart answer file
  template:
    src: ks_cfg.j2
    dest: /var/www/htdocs/ks.cfg
    owner: root
    group: wheel
    mode: 0644
  when: pxe_install_enabled

- name: Template httpd.conf
  template:
    src: httpd_conf.j2
    dest: /etc/httpd.conf
    owner: root
    group: wheel
    mode: 0644
    validate: "httpd -n -f %s"
  when: pxe_install_enabled

- name: Enable and start httpd
  service:
    name: httpd
    state: started
    enabled: yes
  when: pxe_install_enabled

- name: Enable and start tftpd
  service:
    name: tftpd
    state: started
    enabled: yes
    arguments: "-l {{ pxe_install_listen_ip }} {{ pxe_install_tftp_root }}"
  when: pxe_install_enabled

# Full teardown: stop/disable both daemons and remove every file this role
# ever wrote, including the fetched boot images and the templated
# kickstart file (which carries a SHA-512 crypt root password hash).
- name: Stop and disable tftpd
  service:
    name: tftpd
    state: stopped
    enabled: no
  when: not pxe_install_enabled

- name: Stop and disable httpd
  service:
    name: httpd
    state: stopped
    enabled: no
  when: not pxe_install_enabled

- name: Remove httpd.conf
  file:
    path: /etc/httpd.conf
    state: absent
  when: not pxe_install_enabled

- name: Remove kickstart file
  file:
    path: /var/www/htdocs/ks.cfg
    state: absent
  when: not pxe_install_enabled

- name: Remove tftp root and all fetched boot files
  file:
    path: "{{ pxe_install_tftp_root }}"
    state: absent
  when: not pxe_install_enabled

---
- name: Install samba and Time Machine dependencies
  ansible.builtin.dnf:
    name:
      # vfs_fruit.so ships inside the base samba package on Rocky 9 (samba
      #  4.23.5-10.el9_8 confirmed via `dnf repoquery -l samba`) - there is
      #  no separate samba-vfs-modules package.
      - samba
      - avahi
      - policycoreutils-python-utils
    state: present
  become: true

- name: Create Time Machine share directory
  ansible.builtin.file:
    path: "{{ samba_timemachine_share_path }}"
    state: directory
    owner: esteele
    group: esteele
    mode: 0770
  become: true

- name: Set SELinux context for the share directory
  community.general.sefcontext:
    target: "{{ samba_timemachine_share_path }}(/.*)?"
    setype: samba_share_t
    state: present
  become: true
  notify: Apply SELinux context on share

- name: Template smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: 0644
    validate: "testparm -s %s"
  become: true
  notify: Restart smb

- name: Template avahi Time Machine service definition
  ansible.builtin.template:
    src: adisk.service.j2
    dest: /etc/avahi/services/adisk.service
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Restart avahi-daemon

- name: Open firewalld services for Samba and mDNS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop:
    - samba
    - mdns

- name: Enable and start smb
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true
  become: true

- name: Enable and start avahi-daemon
  ansible.builtin.service:
    name: avahi-daemon
    state: started
    enabled: true
  become: true

- name: Flush handlers so the SELinux context and services are correct immediately
  ansible.builtin.meta: flush_handlers

---
- name: Install policycoreutils (for SELinux context management)
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  become: true

- name: Create Samba-only Unix accounts for additional Time Machine users
  # Samba's tdbsam backend still needs a real Unix account per user (its
  #  password is separate, set later via smbpasswd) - no shell/home since
  #  these accounts only ever authenticate over SMB, never log in. Added to
  #  the esteele group (not as primary group) so they inherit write access
  #  to the share directory the same way esteele does.
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
    create_home: false
    password_lock: true
    groups: esteele
    append: true
  loop: "{{ samba_timemachine_extra_accounts }}"
  become: true

- name: Create Time Machine share directory
  ansible.builtin.file:
    path: "{{ samba_timemachine_share_path }}"
    state: directory
    owner: esteele
    group: esteele
    mode: 0770
  become: true

- name: Mount the Time Machine partition
  ansible.posix.mount:
    path: "{{ samba_timemachine_share_path }}"
    src: "{{ samba_timemachine_device }}"
    fstype: xfs
    opts: defaults
    state: mounted
  become: true

- name: Re-apply ownership now the partition is mounted over the share directory
  ansible.builtin.file:
    path: "{{ samba_timemachine_share_path }}"
    state: directory
    owner: esteele
    group: esteele
    mode: 0770
  become: true

- name: Set SELinux context for the share directory
  community.general.sefcontext:
    target: "{{ samba_timemachine_share_path }}(/.*)?"
    setype: samba_share_t
    state: present
  become: true

- name: Apply SELinux context to the share directory
  # Unconditional, not notify-triggered: the fcontext rule above only
  #  changes when its target pattern changes, but the backing filesystem
  #  (sdb3) can be reformatted independently (e.g. after a repartition),
  #  which resets every file back to unlabeled_t regardless of whether the
  #  rule itself is new. restorecon is cheap and idempotent, so just always
  #  run it.
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ samba_timemachine_share_path }}"
  become: true
  register: samba_timemachine_restorecon
  changed_when: samba_timemachine_restorecon.stdout != ""

- name: Template avahi Time Machine service definition
  ansible.builtin.template:
    src: adisk.service.j2
    dest: /etc/avahi/services/adisk.service
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Restart avahi-daemon

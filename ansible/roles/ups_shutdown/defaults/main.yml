---
# upd(4) device the UPS attaches as. The firewall has a single USB HID
# power device (the CyberPower BR700ELCD), so this is upd0.
ups_shutdown_sensor_dev: upd0

# sensorsd.conf(5) can only address sensors by index, so these pin which
# upd0 sensors carry AC presence and battery charge. The "Check upd sensor
# layout" task fails the play if they ever stop matching the descriptions
# upd(4) reports (ACPresent / RemainingCapacity).
ups_shutdown_ac_sensor: indicator2
ups_shutdown_charge_sensor: percent0

# Power off once the UPS is on battery and charge falls below this - not
# when mains first fails; the firewall should ride out as much of an
# outage as the battery allows. The UPS's own RunTimeToEmpty read ~45-50
# minutes on full charge (2026-10-05) whether load showed 1% or 10%, so it
# doesn't track this load and is probably pessimistic. Even taken at face
# value, 10% is ~4-5 minutes, against the ~1 minute sensorsd takes to
# confirm the reading plus a few seconds for the halt itself.
ups_shutdown_min_charge: 10

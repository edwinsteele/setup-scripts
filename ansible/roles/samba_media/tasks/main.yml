---
- name: Install policycoreutils (for SELinux context management)
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  become: true

- name: Create Media share directory
  ansible.builtin.file:
    path: "{{ samba_media_share_path }}"
    state: directory
    owner: esteele
    group: esteele
    mode: 0770
  become: true

- name: Mount the media partition
  ansible.posix.mount:
    path: "{{ samba_media_share_path }}"
    src: "{{ samba_media_device }}"
    fstype: xfs
    opts: defaults
    state: mounted
  become: true

- name: Re-apply ownership now the partition is mounted over the share directory
  ansible.builtin.file:
    path: "{{ samba_media_share_path }}"
    state: directory
    owner: esteele
    group: esteele
    mode: 0770
  become: true

- name: Set SELinux context for the share directory
  community.general.sefcontext:
    target: "{{ samba_media_share_path }}(/.*)?"
    setype: samba_share_t
    state: present
  become: true
  notify: Apply SELinux context on media share

- name: Flush handlers so the SELinux context is correct immediately
  ansible.builtin.meta: flush_handlers

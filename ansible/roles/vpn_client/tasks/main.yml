---
# Tailscale replaced the IPsec VPN, so this role now only removes it.
#  Delete the role (and its site.yml entry) once it has run on the gateway.
# /etc/iked itself, its subdirectories, private/local.key and pubkeys/ are
#  base-system (rc regenerates local.key at boot), so they stay.
# Unlike vpn_concentrator, this leaves net.inet.ip.forwarding alone: the
#  gateway routes the home LAN and the firewall role sets it.
- name: Stop and disable iked
  ansible.builtin.service:
    name: iked
    state: stopped
    enabled: false

- name: Remove iked.conf
  ansible.builtin.file:
    path: /etc/iked.conf
    state: absent

- name: Remove the ikectl 'vpn' CA directory
  ansible.builtin.file:
    path: /etc/ssl/vpn
    state: absent

- name: Find iked CA, certificate and CRL files
  ansible.builtin.find:
    paths:
      - /etc/iked/ca
      - /etc/iked/certs
      - /etc/iked/crls
    file_type: any
    hidden: true
  register: vpn_client_iked_pki_files

- name: Find iked private keys other than local.key
  ansible.builtin.find:
    paths: /etc/iked/private
    excludes: local.key
    file_type: any
    hidden: true
  register: vpn_client_iked_private_files

- name: Remove iked CA, certificate, CRL and private key files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vpn_client_iked_pki_files.files + vpn_client_iked_private_files.files }}"
  loop_control:
    label: "{{ item.path }}"

---
- name: Restart fuelsignal workbench
  ansible.builtin.systemd:
    daemon_reload: true
    name: fuelsignal-workbench.service
    state: restarted
  become: true

- name: Reload systemd for fuelsignal units
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Apply SELinux context on uv binary
  ansible.builtin.command: restorecon -F /usr/local/bin/uv
  become: true

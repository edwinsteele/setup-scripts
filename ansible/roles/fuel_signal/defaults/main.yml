---
fuel_signal_user: fuelsignal
fuel_signal_group: fuelsignal
fuel_signal_base_dir: /srv/fuelsignal
fuel_signal_repo_dir: "{{ fuel_signal_base_dir }}/fuel-price-signal"
fuel_signal_repo_url: https://github.com/edwinsteele/fuel-price-signal.git
fuel_signal_repo_version: main

# LAN-only workbench bind - override per-host (e.g. host_vars/192.168.20.200.yml
# for viking) with the box's real LAN address. Deliberately defaults to
# loopback rather than 0.0.0.0 so a host that forgets to override this
# doesn't accidentally expose the workbench.
fuel_signal_workbench_host: 127.0.0.1
fuel_signal_workbench_port: 5000

# How often to pull, sync, load today's snapshot CSV, and print the
# buy/wait signal. Any systemd OnCalendar expression - see systemd.time(7).
#
# 2am Sydney time is a *start* time, not a guessed safe margin: the script
# now waits (fuel_signal_daily_update_snapshot_wait_* below) for today's
# snapshot from upstream fuel-price-signal's daily-snapshot GitHub Action
# (.github/workflows/daily-snapshot.yml, cron "0 10 * * *" = 10:00 UTC).
# History: this was 12:00 UTC, then pushed back to 2am Sydney after the
# Action was seen starting hours late - but GitHub's scheduled-run delay
# has no upper bound (observed 3h11m-7h50m, committing as late as 17:50
# UTC), so any fixed time still lost the race some nights and viking ran
# the whole day on yesterday's snapshot. Earlier than 2am would just wait
# longer; later would delay the cache for nothing on nights the Action is
# on time.
#
# Named zone, not a raw UTC offset: systemd resolves "Australia/Sydney"
# from its own tzdata regardless of viking's configured local time (same
# non-host-dependent spirit as the old explicit "UTC" suffix), so this
# stays 2am Sydney wall-clock time across the AEST/AEDT transition rather
# than drifting to 3am once daylight saving starts. The 16:00 UTC this
# resolves to under AEST is still comfortably same-UTC-day as the Action's
# 10:00 UTC run, so `today="$(date -u +%Y-%m-%d)"` in
# fuelsignal-daily-update.sh.j2 needs no change.
fuel_signal_daily_update_oncalendar: "*-*-* 02:00:00 Australia/Sydney"

# How often to re-run `git pull` while today's snapshot CSV
# (data/snapshots/YYYY/MM/YYYY-MM-DD.csv, UTC date) hasn't landed yet.
# Each round is one cheap fetch against GitHub; 10 minutes keeps the
# cache at most ~10 minutes behind the snapshot commit.
fuel_signal_daily_update_snapshot_poll_interval_seconds: 600

# How long (total) to keep polling before giving up and running the rest of
# the pipeline against existing data, logging a warning-priority journal
# line. 6h takes a 2am Sydney start to ~8am - before anyone checks the app
# in the morning - and keeps the whole wait inside the same UTC day as the
# snapshot it's waiting for (start is 15:00/16:00 UTC). Giving up rather
# than failing still lets code changes, the workbench restart and the cache
# regeneration happen; the API's `freshness` block reports the staleness.
fuel_signal_daily_update_snapshot_wait_timeout_seconds: 21600

# How long (total, polling /healthz every 5s) to wait after restarting
# fuelsignal-workbench.service for it to start accepting connections at
# all, before giving up on warming it. uv run needs to spin the process up
# and waitress needs to bind its socket - confirmed on viking this can take
# well over 60s right after a big fill run, so this is a ceiling on polling
# rather than a single blind sleep.
fuel_signal_workbench_warmup_ready_timeout_seconds: 120

# Per-path timeout for the actual warm-up GETs below, once /healthz answers.
# Deliberately generous and single-shot (no curl --retry): the first hit to
# a data-heavy page right after a full daily_prices rebuild can legitimately
# take minutes on viking's constrained hardware (cold disk cache) - and
# Flask keeps running the view function to completion server-side even
# after a client gives up, so retrying just piles up duplicate concurrent
# copies of the same expensive query rather than helping (confirmed: this
# is what made warming `/` fail outright the first time this was wired up).
fuel_signal_workbench_warmup_timeout_seconds: 240

# Pages curled after that restart so the first real visitor isn't the one
# paying for cold-start latency. Limited to routes that work with no query
# string (see fuel_signal.inspect's @app.route list) - /api/stations/search
# and /features/plot/<feature_name> both require arguments, so aren't
# included.
fuel_signal_workbench_warmup_paths:
  - /
  - /lead-lag
  - /classification-health
  - /features

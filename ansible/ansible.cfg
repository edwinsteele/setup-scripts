[defaults]
inventory = inventory.yml
retry_files_enabled = False
# ansible-core 2.19+ auto-disables pipelining for doas unless the become
# plugin's ansible_doas_allow_pipelining=true, which is only safe when doas
# is nopass for that become_user - see the doas_become plugin docs
pipelining = True
# Explicit defaults, recorded so future readers don't have to know Ansible's
# implicit behavior:
host_key_checking = True
roles_path = roles

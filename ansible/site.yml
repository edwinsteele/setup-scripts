---
# A fresh OpenBSD host has no Python interpreter yet, so facts can't be
#  gathered until the bootstrap role installs one - hence gather_facts:
#  false and a plain linear strategy for this first play.
# rocky_9 is excluded throughout this file's "all" plays: it ships its own
#  Python interpreter (no bootstrap needed) and roles like network/pf/
#  mail_sender are OpenBSD-only (pfctl, doas, openbsd_pkg) - it gets its
#  own plays further down instead.
- hosts: 'all:!rocky_9'
  gather_facts: false
  strategy: linear
  roles:
    - bootstrap

- hosts: 'all:!rocky_9'
  roles:
    - common
    - { role: network, tags: network }
    - { role: pf, tags: pf }
    - mail_sender
    - esteele_acct

- hosts: wordspeak
  roles:
    - wordspeak_site

- hosts: wordspeak
  roles:
    - vpn_concentrator

- hosts: firewalls
  become: true
  become_method: community.general.doas
  become_user: root
  roles:
    - { role: firewall, tags: firewall }
    - { role: vpn_client, tags: vpn_client }
    - { role: pxe_install, tags: pxe_install }
  vars_files:
    - /Users/esteele/Code/local_setup-scripts/ansible/roles/firewall/vars/private_vars.yml
    - /Users/esteele/Code/local_setup-scripts/ansible/roles/firewall/vars/local_address_vars.yml

- hosts: rocky_9
  roles:
    - common
    - esteele_acct
    - samba_server
    - samba_timemachine
    - samba_media
    - home_assistant
    - fuel_signal
    - dvb_tuner
    - tvheadend

- hosts: rocky_9
  remote_user: esteele
  roles:
    - esteele_contents
    - git

- hosts: 'all:!rocky_9'
  remote_user: esteele
  roles:
    - esteele_contents
    - git

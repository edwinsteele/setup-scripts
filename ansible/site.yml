---
# A fresh OpenBSD host has no Python interpreter yet, so facts can't be
#  gathered until the bootstrap role installs one - hence gather_facts:
#  false and a plain linear strategy for this first play.
# rocky_9 is excluded throughout this file's "all" plays: it ships its own
#  Python interpreter (no bootstrap needed) and roles like network/pf are
#  OpenBSD-only (pfctl, doas, openbsd_pkg) - it gets its own plays further
#  down instead. mail_sender is the exception - it dispatches by
#  ansible_facts['os_family'] (like common/esteele_acct) and gets applied
#  in both places.
- hosts: 'all:!rocky_9'
  gather_facts: false
  strategy: linear
  roles:
    - bootstrap

- hosts: 'all:!rocky_9'
  roles:
    - common
    - { role: network, tags: network }
    - { role: pf, tags: pf }
    - mail_sender
    - esteele_acct

- hosts: wordspeak
  roles:
    - wordspeak_site

- hosts: wordspeak
  roles:
    - vpn_concentrator

- hosts: firewalls
  become: true
  become_method: community.general.doas
  become_user: root
  roles:
    - { role: firewall, tags: firewall }
    - { role: vpn_client, tags: vpn_client }
    - { role: pxe_install, tags: pxe_install }
    - { role: ups_shutdown, tags: ups_shutdown }
  vars_files:
    - /Users/esteele/Code/local_setup-scripts/ansible/roles/firewall/vars/private_vars.yml
    - /Users/esteele/Code/local_setup-scripts/ansible/roles/firewall/vars/local_address_vars.yml

# Every rocky_9 role carries a tag named after itself, so one role can be
#  re-applied with e.g. `--tags fuel_signal --limit viking.home.wordspeak.org`.
#  Role defaults and handlers still load for roles the tag skips, so
#  cross-role references (reverse_proxy reading fuel_signal/gitdeck ports,
#  samba_timemachine notifying samba_server's avahi handler) keep working.
- hosts: rocky_9
  roles:
    - { role: common, tags: common }
    - { role: mail_sender, tags: mail_sender }
    - { role: esteele_acct, tags: esteele_acct }
    - { role: samba_server, tags: samba_server }
    - { role: samba_timemachine, tags: samba_timemachine }
    - { role: samba_media, tags: samba_media }
    - { role: home_assistant, tags: home_assistant }
    - { role: fuel_signal, tags: fuel_signal }
    - { role: dvb_tuner, tags: dvb_tuner }
    - { role: tvheadend, tags: tvheadend }
    - { role: gitdeck, tags: gitdeck }
    - { role: reverse_proxy, tags: reverse_proxy }
    - { role: nut_ups, tags: nut_ups }
    - { role: tailscale, tags: tailscale }
  vars_files:
    - /Users/esteele/Code/local_setup-scripts/ansible/roles/nut_ups/vars/private_vars.yml

- hosts: rocky_9
  remote_user: esteele
  roles:
    - { role: esteele_contents, tags: esteele_contents }
    - { role: git, tags: git }

- hosts: 'all:!rocky_9'
  remote_user: esteele
  roles:
    - esteele_contents
    - git
